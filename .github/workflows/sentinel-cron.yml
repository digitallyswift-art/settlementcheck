name: Autonomous SERP Sentinel 24/7 Fleet

on:
  schedule:
    # Runs daily at 03:30 UTC (24/7 autonomous scheduled trigger in the cloud)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI if needed

jobs:
  run-autonomous-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Autonomous SEO Actuator (4-Agent Loop)
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || 'sc-domain:settlementcheck.co.uk' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run sentinel:act

      - name: Apply Low-Risk Staged Fixes for Auto-PR
        run: |
          npm run sentinel:apply

      - name: Run Deterministic Quality Gates (Verify)
        run: |
          npm run verify

      - name: Open & Auto-Merge Verified Low-Risk PR
        id: auto_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "SettlementCheck Sentinel Fleet"
          git config --global user.email "sentinel@settlementcheck.co.uk"

          git add data/serp-actions/ app/
          if git diff --staged --quiet; then
            echo "No staged SEO, link, copy, or log changes to open a PR for."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "auto_merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Safety guard: ensure only allowlisted low-risk paths were modified
          DISALLOWED=$(git diff --cached --name-only | grep -vE '^(data/serp-actions/|app/guides/|app/sectors/|app/scenarios/)' || true)
          if [ -n "$DISALLOWED" ]; then
            echo "Non-allowlisted paths detected; holding PR for manual review:"
            echo "$DISALLOWED"
          fi

          BRANCH_NAME="sentinel/auto-seo-pr"
          git checkout -B "$BRANCH_NAME"
          git commit -m "chore(sentinel): autonomous low-risk SEO & copy updates"
          git push --force-with-lease origin "$BRANCH_NAME"

          PR_BODY_FILE="data/serp-actions/staging/latest-pr-summary.md"
          if [ ! -f "$PR_BODY_FILE" ]; then
            echo "Autonomous Sentinel SEO & copy updates verified by \`npm run verify\`." > "$PR_BODY_FILE"
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "chore(sentinel): autonomous low-risk SEO & copy updates" --body-file "$PR_BODY_FILE"
            PR_URL="$EXISTING_PR"
          else
            PR_URL=$(gh pr create --base main --head "$BRANCH_NAME" --title "chore(sentinel): autonomous low-risk SEO & copy updates" --body-file "$PR_BODY_FILE")
          fi

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

          if [ -z "$DISALLOWED" ]; then
            gh pr merge "$PR_URL" --squash --delete-branch
            echo "Auto-PR merged into main: $PR_URL"
            echo "auto_merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "Auto-PR held for manual review: $PR_URL"
            echo "auto_merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Action Summary Email Digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          SEO_ALERT_EMAILS: ${{ secrets.SEO_ALERT_EMAILS }}
          AUTO_PR_URL: ${{ steps.auto_pr.outputs.pr_url }}
          AUTO_MERGED: ${{ steps.auto_pr.outputs.auto_merged }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            npm run sentinel:email
          else
            echo "RESEND_API_KEY not configured; skipping email digest."
          fi
