<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SettlementCheck Widget Test Page</title>
  <style>
    body {
      background-color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #0b1f3a;
      margin-bottom: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }
    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .widget-panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .widget-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #5b6577;
      text-align: center;
      border-bottom: 1px dashed #e2dcce;
      padding-bottom: 10px;
    }
  </style>
  <!-- Load the widget script -->
  <script src="/widget.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>SettlementCheck Embedded Widget Preview</h1>
    
    <div class="grid">
      <!-- Widget Option A -->
      <div class="widget-panel">
        <div class="widget-title">Option A: Light Theme + Lead Capture (Default)</div>
        <settlement-check-calculator 
          theme="light" 
          capture-leads="true" 
          partner-id="solicitor_firm_test_123">
        </settlement-check-calculator>
      </div>

      <!-- Widget Option B -->
      <div class="widget-panel" style="background-color: #061324;">
        <div class="widget-title" style="color: #a4b2c6; border-bottom-color: #233957;">Option B: Dark Theme + Custom Color + Direct Redirect</div>
        <settlement-check-calculator 
          theme="dark" 
          primary-color="#3c64b4" 
          capture-leads="false" 
          partner-id="affiliate_partner_abc">
        </settlement-check-calculator>
      </div>
    </div>
  </div>
</body>
</html>
